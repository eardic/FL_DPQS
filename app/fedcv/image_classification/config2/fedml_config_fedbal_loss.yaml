common_args:
  training_type: "simulation"
  random_seed: 0

data_args:
  dataset: "cifar10"
  data_cache_dir: "fedcv_data/"
  partition_method: "hetero-fix"
  partition_alpha: 0.5

data_val_args:
  data_val_algo: "fedbal_loss"   # loo, gnorm, tmc, fedbal
  fedbal_prob: 0.75
  fedbal_update_period: 10
  fedbal_step_size: 0.05
  data_val_save_scores: 1

model_args:
  model: "vgg7_bn"

train_args:
  federated_optimizer: "FedAvg"
  client_id_list: "[]"
  client_num_in_total: 1000
  client_num_per_round: 100
  comm_round: 1000
  epochs: 5
  batch_size: 1000
  client_optimizer: sgd
  learning_rate: 0.03
  weight_decay: 0.001
  client_max_workers: 1
  client_max_test_size: 0
  client_label_noise: 0
#   client_max_test_size: 200
#   client_label_noise: 0.6

# dp_args:
#   enable_dp: true
#   dp_type: ldp # cdp or ldp
#   epsilon: 1
#   delta: 0
#   sensitivity: 0.01
#   mechanism_type: laplace

validation_args:
  frequency_of_the_test: 3

device_args:
  using_gpu: true
  gpu_id: 0

comm_args:
  backend: "sp"
  is_mobile: 0

tracking_args:
  log_file_dir: ./log
  enable_wandb: true
  wandb_key: 162987faab283f3cf18e0081550378231b666714
  wandb_project: fedml-vgg7
  # wandb_name: cifar10-1k-100-e5-allb-fbloss-nsy0.6-ldp-lap-e1-s0.01
  wandb_name: allb-fbloss
